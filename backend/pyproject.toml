[project]
name = "realtor-devops-ai"
version = "0.1.0"
description = "Real estate development analysis platform for Ottawa property investors"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.14.3",
    "alembic>=1.13.1",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "google-genai>=1.0.0",
    "httpx>=0.26.0",
    "redis[hiredis]>=5.0.1",
    "numpy>=1.26.3",
    "shapely>=2.0.2",
    "geojson>=3.1.0",
    "weasyprint>=61.0",
    "jinja2>=3.1.3",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
